name: Release

# Push a tag like v<version> to publish the package to pub.dev.
# The tag must match the version in pubspec.yaml and be on main or a release/* branch.
# Wait for CI to be green on that branch before you push the tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # All CI tests must pass on the tag before anything is published.
  # On a tag they use pub.dev only.
  test:
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev automated publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          v=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, pubspec $v"; exit 1; }
          # main, or a release/* branch for a patch of an older version
          git branch -r --contains "$GITHUB_SHA" | grep -qE '^ *origin/(main|release/.+)$' || { echo "::error::the tag is not on main or a release/* branch"; exit 1; }
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Publish to pub.dev
        run: dart pub publish --force
